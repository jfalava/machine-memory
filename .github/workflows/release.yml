name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check CLI
        run: bun run --cwd cli check

      - name: Typecheck CLI
        run: bun run --cwd cli typecheck

      - name: Build host binary
        run: bun run --cwd cli build

  build:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: cli/dist/machine-memory
            archive: cli/dist/machine-memory-linux-x64.zip
            artifact_name: machine-memory-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            outfile: cli/dist/machine-memory
            archive: cli/dist/machine-memory-linux-arm64.zip
            artifact_name: machine-memory-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: cli/dist/machine-memory
            archive: cli/dist/machine-memory-darwin-arm64.zip
            artifact_name: machine-memory-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            outfile: cli/dist/machine-memory.exe
            archive: cli/dist/machine-memory-windows-x64.zip
            artifact_name: machine-memory-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${TAG}\"/" cli/package.json
          rm -f package.json.bak

      - name: Build target
        run: bun build --compile --target=${{ matrix.target }} cli/src/app.ts --outfile ${{ matrix.outfile }}

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "${{ matrix.archive }}" "${{ matrix.outfile }}"
          else
            zip -j "${{ matrix.archive }}" "${{ matrix.outfile }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: machine-memory-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
